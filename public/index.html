<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eAuto QA Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Cyberpunk sunset palette ── */
  --bg: #080810;
  --surface: #0f0f1a;
  --surface2: #15151f;
  --surface3: #1d1d2b;
  --border: #2a2236;
  --border2: #3a2f48;
  --text: #f3e9f5;
  --text2: #9b8fb0;
  --text3: #645a78;

  /* primary = hot pink, leads the sunset gradient */
  --accent: #ff3d7f;
  --accent-dim: rgba(255,61,127,0.12);
  --accent-border: rgba(255,61,127,0.4);
  --orange: #ff8a3d;
  --sunset: linear-gradient(135deg, #ff3d7f 0%, #ff6b4a 50%, #ff8a3d 100%);
  --sunset-soft: linear-gradient(135deg, rgba(255,61,127,0.18), rgba(255,138,61,0.18));

  /* secondary = neon cyan (classic cyberpunk pairing) */
  --blue: #2de2ff;
  --blue-dim: rgba(45,226,255,0.12);
  --amber: #ffb347;
  --amber-dim: rgba(255,179,71,0.12);
  --red: #ff4d6d;
  --red-dim: rgba(255,77,109,0.12);
  --purple: #c77dff;
  --purple-dim: rgba(199,125,255,0.12);

  /* neon glows */
  --glow-pink: 0 0 8px rgba(255,61,127,0.5), 0 0 2px rgba(255,61,127,0.8);
  --glow-cyan: 0 0 8px rgba(45,226,255,0.45), 0 0 2px rgba(45,226,255,0.8);

  --mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
  --display: 'Orbitron', 'JetBrains Mono', monospace;
  --sans: 'JetBrains Mono', 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  min-height: 100vh;
  position: relative;
}
/* faint cyber grid */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(45,226,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,61,127,0.035) 1px, transparent 1px);
  background-size: 44px 44px;
}
/* glowing radial wash in the corners */
body::after {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle at 12% 0%, rgba(255,61,127,0.10), transparent 38%),
    radial-gradient(circle at 100% 100%, rgba(45,226,255,0.08), transparent 40%);
}
/* keep app content above the bg layers */
.nav, .tab-panel, #qt-modal-overlay { position: relative; z-index: 1; }
/* scanline overlay */
#scanlines { position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.10) 3px);
  mix-blend-mode: multiply; opacity: 0.5; }

/* ── NAV ── */
.nav { display: flex; align-items: center; gap: 2px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); height: 44px; position: sticky; top: 0; z-index: 100; }
.nav-logo { font-weight: 600; font-size: 13px; color: var(--accent); margin-right: 16px; letter-spacing: 0.04em; white-space: nowrap; }
.nav-tab { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text2); cursor: pointer; border: none; background: none; transition: all 0.15s; white-space: nowrap; }
.nav-tab:hover { color: var(--text); background: var(--surface2); }
.nav-tab.active { color: var(--text); background: var(--surface3); }
.nav-tab.soon { color: var(--text3); cursor: default; font-style: italic; }
.nav-tab.soon:hover { background: none; color: var(--text3); }

/* ── MAIN ── */
.tab-panel { display: none; padding: 28px 28px; max-width: 1100px; margin: 0 auto; }
.tab-panel.active { display: block; }

/* ── SECTION ── */
.section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: var(--text3); text-transform: uppercase; margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }

/* ── FORM ELEMENTS ── */
label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 5px; }
input[type=text], input[type=password], input[type=email], select {
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px;
  color: var(--text); font-family: var(--sans); font-size: 13px;
  padding: 8px 12px; width: 100%; outline: none; transition: border 0.15s;
}
input:focus, select:focus { border-color: var(--blue); }
input:disabled { opacity: 0.5; cursor: not-allowed; }
.form-row { display: grid; gap: 14px; margin-bottom: 14px; }
.form-row.cols2 { grid-template-columns: 1fr 1fr; }
.form-row.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.input-wrap { position: relative; }
.input-wrap input { padding-right: 36px; }
.eye-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; font-size: 14px; padding: 0; }
.eye-btn:hover { color: var(--text2); }

/* ── TOGGLE BUTTONS ── */
.toggle-group { display: flex; gap: 4px; flex-wrap: wrap; }
.tog { padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 500; border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); cursor: pointer; transition: all 0.15s; }
.tog:hover { border-color: var(--blue); color: var(--text); }
.tog.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.tog.active-green { background: var(--accent); border-color: var(--accent); color: #0f0f0f; }
.tog-rand { padding: 6px 10px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text3); cursor: pointer; white-space: nowrap; }
.tog-rand:hover { border-color: var(--purple); color: var(--purple); }
.tog-rand.active { border-color: var(--purple); color: var(--purple); background: rgba(167,139,250,0.1); }

/* ── BUTTONS ── */
.btn { padding: 9px 20px; border-radius: 7px; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
.btn-run { background: var(--accent); color: #0f0f0f; }
.btn-run:hover { background: #22c55e; }
.btn-run:disabled { background: var(--surface3); color: var(--text3); cursor: not-allowed; }
.btn-stop { background: none; border: 1px solid var(--red); color: var(--red); }
.btn-stop:hover { background: rgba(248,113,113,0.1); }
.btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 5px; }
.btn-actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }

/* ── LOG PANEL ── */
.log-panel { background: #0a0a0a; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; height: 240px; overflow-y: auto; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
.log-line { white-space: pre-wrap; word-break: break-all; }
.log-line.success { color: var(--accent); }
.log-line.error { color: var(--red); }
.log-line.warning { color: var(--amber); }
.log-line.info { color: var(--text2); }
.log-line.muted { color: var(--text3); }
.log-ts { color: var(--text3); margin-right: 6px; }

/* ── STEP CARDS ── */
.step-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.step-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; transition: border-color 0.2s; }
.step-card.running { border-color: var(--blue); }
.step-card.done { border-color: rgba(74,222,128,0.3); }
.step-card.error { border-color: rgba(248,113,113,0.3); }
.step-num { font-size: 10px; color: var(--text3); font-family: var(--mono); min-width: 18px; }
.step-label { font-size: 12px; color: var(--text2); flex: 1; }
.step-icon { font-size: 14px; min-width: 18px; text-align: right; }
.step-card.running .step-label { color: var(--blue); }
.step-card.done .step-label { color: var(--accent); }
.step-card.error .step-label { color: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.step-card.running .step-icon { animation: pulse 1s infinite; }

/* ── RESULT CARD ── */
.result-card { background: var(--surface2); border: 1px solid rgba(74,222,128,0.3); border-radius: 10px; padding: 18px 20px; display: none; }
.result-card.visible { display: block; }
.result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 24px; margin-top: 12px; }
.result-kv { display: flex; flex-direction: column; gap: 2px; }
.result-key { font-size: 11px; color: var(--text3); }
.result-val { font-size: 13px; color: var(--text); word-break: break-all; }
.result-url { font-family: var(--mono); font-size: 11px; color: var(--blue); word-break: break-all; }
.result-url a { color: var(--blue); text-decoration: none; }
.result-url a:hover { text-decoration: underline; }

/* ── ENV QUICK SELECT ── */
.env-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.env-preset { padding: 5px 12px; border-radius: 5px; font-size: 12px; font-family: var(--mono); border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); cursor: pointer; }
.env-preset:hover { border-color: var(--accent); color: var(--accent); }
.env-preset.active { border-color: var(--accent); color: var(--accent); background: rgba(74,222,128,0.08); }

/* ── INSURANCE TABLE ── */
.vehicle-table-wrap { overflow-x: auto; }
.vehicle-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.vehicle-table th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--text3); text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.vehicle-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
.vehicle-table input { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 5px 8px; font-size: 13px; color: var(--text); width: 100%; outline: none; font-family: var(--sans); }
.vehicle-table input:focus { border-color: var(--blue); background: var(--surface2); }
.vehicle-table select { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 5px 6px; font-size: 13px; color: var(--text); outline: none; cursor: pointer; }
.vehicle-table select:focus { border-color: var(--blue); background: var(--surface2); }
.vehicle-table .row-num { color: var(--text3); font-family: var(--mono); font-size: 11px; text-align: center; width: 28px; }
.remove-row-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
.remove-row-btn:hover { color: var(--red); background: rgba(248,113,113,0.1); }
.add-row-btn { margin-top: 10px; padding: 6px 14px; font-size: 12px; background: none; border: 1px dashed var(--border2); color: var(--text3); border-radius: 6px; cursor: pointer; }
.add-row-btn:hover { border-color: var(--text2); color: var(--text2); }

/* ── RESULTS TABLE ── */
.results-section { margin-top: 24px; display: none; }
.results-section.visible { display: block; }
.stats-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.stat-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; text-align: center; min-width: 100px; }
.stat-chip .stat-n { font-size: 22px; font-weight: 600; }
.stat-chip .stat-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
.stat-chip.blue .stat-n { color: var(--blue); }
.stat-chip.green .stat-n { color: var(--accent); }
.stat-chip.red .stat-n { color: var(--red); }
.stat-chip.amber .stat-n { color: var(--amber); }

.vehicle-group { margin-bottom: 20px; }
.vehicle-header { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px 8px 0 0; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.vehicle-reg { font-size: 15px; font-weight: 600; font-family: var(--mono); color: var(--text); }
.vehicle-meta { font-size: 12px; color: var(--text2); }
.vehicle-meta span { margin-right: 12px; }
.ins-table-wrap { border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
.ins-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.ins-table th { background: var(--surface3); text-align: left; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text3); padding: 7px 12px; border-bottom: 1px solid var(--border); }
.ins-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.ins-table tr:last-child td { border-bottom: none; }
.ins-table .allow-yes { color: var(--accent); font-weight: 600; }
.ins-table .allow-no { color: var(--red); font-weight: 600; }
.ins-table .price { font-family: var(--mono); font-weight: 600; color: var(--text); }

.skipped-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.skipped-table th { text-align: left; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text3); padding: 7px 12px; border-bottom: 1px solid var(--border); }
.skipped-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text2); }
.skipped-table tr:last-child td { border-bottom: none; }

/* ══════════ QA TRACKER (ported from qa-tracker_1.html, scoped to #tab-tracker) ══════════ */
#tab-tracker { max-width: 900px; margin: 0 auto; }

/* Header */
#tab-tracker .header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; gap: 16px; flex-wrap: wrap; }
#tab-tracker .header-left h1 { font-family: var(--mono); font-size: 18px; font-weight: 500; letter-spacing: -0.3px; }
#tab-tracker .header-left p { font-size: 12px; color: var(--text3); font-family: var(--mono); margin-top: 2px; }
#tab-tracker .btn-add { background: var(--accent); color: #0a0a0a; border: none; padding: 8px 16px; border-radius: 6px; font-family: var(--mono); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
#tab-tracker .btn-add:hover { opacity: 0.85; }

/* Stats bar */
#tab-tracker .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 28px; }
#tab-tracker .stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px; padding: 14px 16px; }
#tab-tracker .stat-label { font-size: 10px; font-family: var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
#tab-tracker .stat-val { font-size: 22px; font-family: var(--mono); font-weight: 500; }
#tab-tracker .stat-val.green { color: var(--accent); }
#tab-tracker .stat-val.blue { color: var(--blue); }
#tab-tracker .stat-val.amber { color: var(--amber); }
#tab-tracker .stat-val.red { color: var(--red); }

/* Section header */
#tab-tracker .section-head { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; margin-top: 28px; }
#tab-tracker .section-head::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }
#tab-tracker .section-badge { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 10px; }

/* Ticket card */
#tab-tracker .ticket { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; transition: border-color 0.15s; animation: qtFadeIn 0.2s ease; }
@keyframes qtFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
#tab-tracker .ticket:hover { border-color: var(--border2); }
#tab-tracker .ticket.done { opacity: 0.55; }
#tab-tracker .ticket.blocked { border-left: 2px solid var(--red); }
#tab-tracker .ticket-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
#tab-tracker .ticket-id { font-family: var(--mono); font-size: 11px; color: var(--text3); white-space: nowrap; padding-top: 2px; }
#tab-tracker .ticket-title { flex: 1; font-size: 14px; font-weight: 400; }
#tab-tracker .ticket-actions { display: flex; gap: 6px; align-items: center; }

/* tags */
#tab-tracker .ticket-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
#tab-tracker .tag { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
#tab-tracker .tag-type-bug { background: var(--red-dim); color: var(--red); border: 0.5px solid rgba(248,113,113,0.2); }
#tab-tracker .tag-type-story { background: var(--blue-dim); color: var(--blue); border: 0.5px solid rgba(96,165,250,0.2); }
#tab-tracker .tag-type-task { background: var(--purple-dim); color: var(--purple); border: 0.5px solid rgba(167,139,250,0.2); }
#tab-tracker .tag-type-subtask { background: var(--amber-dim); color: var(--amber); border: 0.5px solid rgba(251,191,36,0.2); }
#tab-tracker .tag-pri-high { background: var(--red-dim); color: var(--red); }
#tab-tracker .tag-pri-medium { background: var(--amber-dim); color: var(--amber); }
#tab-tracker .tag-pri-low { background: var(--surface3); color: var(--text2); border: 0.5px solid var(--border); }
#tab-tracker .tag-status-inprogress { background: var(--blue-dim); color: var(--blue); }
#tab-tracker .tag-status-todo { background: var(--surface3); color: var(--text2); border: 0.5px solid var(--border); }
#tab-tracker .tag-status-blocked { background: var(--red-dim); color: var(--red); }
#tab-tracker .tag-status-done { background: var(--accent-dim); color: var(--accent); }
#tab-tracker .tag-env { background: var(--surface3); color: var(--text2); border: 0.5px solid var(--border); }

/* progress */
#tab-tracker .progress-section { margin-bottom: 12px; }
#tab-tracker .progress-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
#tab-tracker .progress-name { font-size: 12px; color: var(--text2); }
#tab-tracker .progress-pct { font-family: var(--mono); font-size: 12px; color: var(--text); }
#tab-tracker .progress-sub { font-size: 11px; color: var(--text3); font-family: var(--mono); }
#tab-tracker .progress-bar-wrap { height: 4px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
#tab-tracker .progress-bar-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.4s ease; }
#tab-tracker .progress-bar-fill.low { background: var(--red); }
#tab-tracker .progress-bar-fill.medium { background: var(--amber); }
#tab-tracker .progress-modules { display: flex; flex-direction: column; gap: 7px; }
#tab-tracker .blocked-note { background: var(--red-dim); border: 0.5px solid rgba(248,113,113,0.2); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--red); margin-bottom: 12px; }

/* daily log */
#tab-tracker .log-section { border-top: 0.5px solid var(--border); padding-top: 12px; margin-top: 12px; }
#tab-tracker .log-head { font-family: var(--mono); font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
#tab-tracker .log-entry { display: flex; gap: 10px; margin-bottom: 5px; }
#tab-tracker .log-date { font-family: var(--mono); font-size: 11px; color: var(--text3); white-space: nowrap; padding-top: 1px; }
#tab-tracker .log-text { font-size: 12px; color: var(--text2); }
#tab-tracker .log-input-row { display: flex; gap: 6px; margin-top: 8px; }
#tab-tracker .log-input { flex: 1; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 12px; font-family: var(--sans); outline: none; }
#tab-tracker .log-input:focus { border-color: var(--border2); }
#tab-tracker .btn-log { background: var(--surface3); border: 0.5px solid var(--border2); color: var(--text2); padding: 6px 12px; border-radius: 6px; font-family: var(--mono); font-size: 11px; cursor: pointer; white-space: nowrap; transition: color 0.15s, border-color 0.15s; }
#tab-tracker .btn-log:hover { color: var(--text); border-color: var(--border2); }

/* icon buttons */
#tab-tracker .icon-btn { background: none; border: 0.5px solid var(--border); border-radius: 5px; padding: 4px 8px; cursor: pointer; font-size: 11px; font-family: var(--mono); color: var(--text2); transition: all 0.15s; white-space: nowrap; }
#tab-tracker .icon-btn:hover { color: var(--text); border-color: var(--border2); }
#tab-tracker .icon-btn.done-btn:hover { color: var(--accent); border-color: var(--accent-border); }
#tab-tracker .icon-btn.edit-btn:hover { color: var(--blue); border-color: rgba(96,165,250,0.3); }
#tab-tracker .icon-btn.del-btn:hover { color: var(--red); border-color: rgba(248,113,113,0.3); }
#tab-tracker .icon-btn.undone-btn:hover { color: var(--amber); border-color: rgba(251,191,36,0.3); }

/* meta */
#tab-tracker .ticket-meta { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
#tab-tracker .meta-item { font-size: 11px; color: var(--text3); font-family: var(--mono); }
#tab-tracker .meta-item span { color: var(--text2); }

#qt-modal-overlay .btn-add-mod:hover { color: var(--text2); border-color: var(--text3); }

/* ── LOG AREA ── */
.log-area { margin-top: 16px; }

   CYBERPUNK SKIN — override layer (appended last so it wins the cascade)

/* headings + display font */
h1, h2 { font-family: var(--display); letter-spacing: 0.04em; }

/* NAV — translucent neon bar */

}

}

}

/* SECTION TITLE — cyan terminal label */
.section-title { color: var(--blue); text-shadow: var(--glow-cyan); position: relative; padding-left: 14px; }

/* INPUTS */

/* BUTTONS — neon */
.btn { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; border-radius: 6px; }
.btn-run { background: var(--sunset); color: #0a0a0f; box-shadow: var(--glow-pink); border: none; }

.btn-run:disabled { background: var(--surface3); color: var(--text3); box-shadow: none; filter: none; }
.btn-stop { border: 1px solid var(--red); color: var(--red); background: none; box-shadow: 0 0 8px rgba(255,77,109,0.25) inset; }
.btn-stop:hover { background: var(--red-dim); box-shadow: 0 0 12px rgba(255,77,109,0.4); }

/* TOGGLES + ENV PRESETS — gradient when active */
.tog, .env-preset { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
.tog.active { background: var(--sunset); border-color: transparent; color: #0a0a0f; box-shadow: var(--glow-pink); }
.tog.active-green { background: var(--blue); border-color: transparent; color: #0a0a0f; box-shadow: var(--glow-cyan); }
.env-preset.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); box-shadow: var(--glow-pink); }
.tog-rand.active { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); box-shadow: var(--glow-cyan); }

/* LOG PANEL — black terminal w/ cyan glow */
.log-panel {
  background: #05050a; border: 1px solid var(--border2); border-radius: 6px;
  box-shadow: inset 0 0 24px rgba(45,226,255,0.05), 0 0 0 1px rgba(45,226,255,0.06);
  font-family: var(--mono);
}
.log-line.success { color: var(--accent); text-shadow: 0 0 6px rgba(255,61,127,0.4); }
.log-line.info { color: var(--blue); }

/* STEP CARDS — neon states */
.step-card { background: rgba(8,8,16,0.6); border: 1px solid var(--border2); border-radius: 6px; }
.step-card.running { border-color: var(--blue); box-shadow: var(--glow-cyan); }
.step-card.running .step-label { color: var(--blue); }
.step-card.done { border-color: var(--accent-border); box-shadow: 0 0 8px rgba(255,61,127,0.25); }
.step-card.done .step-label { color: var(--accent); }
.step-num { color: var(--blue); }

/* RESULT CARD */
.result-card { background: rgba(15,15,26,0.9); border: 1px solid var(--accent-border); box-shadow: 0 0 18px rgba(255,61,127,0.15); }

/* TABLES — terminal grid */
.vehicle-table th, .ins-table th, .skipped-table th { color: var(--blue); }
.ins-table th { background: rgba(45,226,255,0.06); }
.vehicle-header { background: linear-gradient(180deg, rgba(29,29,43,0.9), rgba(21,21,31,0.9)); border-color: var(--border2); }
.vehicle-reg { color: var(--accent); text-shadow: var(--glow-pink); }
.ins-table .allow-yes { color: var(--accent); }
.stat-chip { background: rgba(8,8,16,0.6); border-color: var(--border2); }

/* ── TRACKER tab cyberpunk overrides ── */
#tab-tracker .header-left h1 { font-family: var(--display); font-weight: 900; background: var(--sunset); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
#tab-tracker .btn-add { background: var(--sunset); color: #0a0a0f; box-shadow: var(--glow-pink); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
#tab-tracker .btn-add:hover { filter: brightness(1.1); }
#tab-tracker .stat { background: linear-gradient(180deg, rgba(21,21,31,0.9), rgba(15,15,26,0.9)); border: 1px solid var(--border2); position: relative; overflow: hidden; }
#tab-tracker .stat::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background: var(--sunset); opacity:0.7; }
#tab-tracker .stat-val.green { color: var(--accent); text-shadow: var(--glow-pink); }
#tab-tracker .stat-val.blue { color: var(--blue); text-shadow: var(--glow-cyan); }
#tab-tracker .ticket { background: linear-gradient(180deg, rgba(21,21,31,0.85), rgba(15,15,26,0.85)); border: 1px solid var(--border2); }
#tab-tracker .ticket:hover { border-color: var(--accent-border); box-shadow: 0 0 16px rgba(255,61,127,0.12); }
#tab-tracker .ticket.blocked { border-left: 2px solid var(--red); }
#tab-tracker .filter-btn { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
#tab-tracker .filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); box-shadow: var(--glow-pink); }
#tab-tracker .progress-bar-fill { background: var(--sunset); }
#tab-tracker .progress-bar-fill.low { background: var(--red); }
#tab-tracker .progress-bar-fill.medium { background: var(--amber); }
#tab-tracker .section-head { color: var(--blue); }
#tab-tracker .ticket-title { font-weight: 500; }

/* ── NOTES (tracker) ── */
#tab-tracker .notes-section { border-top: 0.5px solid var(--border); padding-top: 12px; margin-top: 12px; }
#tab-tracker .notes-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
#tab-tracker .notes-head .lbl { font-family: var(--mono); font-size: 10px; color: var(--blue); text-transform: uppercase; letter-spacing: 0.5px; }

#tab-tracker .note-title { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 2px; }

#tab-tracker .note-editor { margin-top: 8px; display: none; }
#tab-tracker .note-editor.open { display: block; }
#tab-tracker .note-editor input, #tab-tracker .note-editor textarea {

}
#tab-tracker .note-editor textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
#tab-tracker .note-editor input:focus, #tab-tracker .note-editor textarea:focus { border-color: var(--accent); box-shadow: var(--glow-pink); }
#tab-tracker .log-del, #tab-tracker .note-del, #tab-tracker .note-edit, #tab-tracker .note-add-btn, #tab-tracker .note-save, #tab-tracker .note-cancel {

}
#tab-tracker .note-add-btn:hover, #tab-tracker .note-save:hover { color: var(--accent); border-color: var(--accent-border); box-shadow: var(--glow-pink); }

/* MODAL — terminal frame */
#qt-modal-overlay .modal { border: 1px solid var(--accent-border); box-shadow: 0 0 40px rgba(255,61,127,0.2), 0 20px 60px rgba(0,0,0,0.7); position: relative; }

<div id="scanlines"></div>

<!-- NAV -->
<nav class="nav">
  <div class="nav-logo">eAuto QA</div>
  <button class="nav-tab active" onclick="switchTab('tracker',this)">QA Tracker</button>

<!-- ════════════════════════════════════════════════════ QA TRACKER TAB -->
<div id="tab-tracker" class="tab-panel active">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>QA Ticket Tracker</h1>
      <p id="dateStamp"></p>
    </div>
    <button class="btn-add" onclick="openModal()">+ New Ticket</button>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="stat-label">Active</div><div class="stat-val blue" id="stat-active">0</div></div>
    <div class="stat"><div class="stat-label">Blocked</div><div class="stat-val red" id="stat-blocked">0</div></div>
    <div class="stat"><div class="stat-label">Completed</div><div class="stat-val green" id="stat-done">0</div></div>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('todo',this)">To Do</button>
    <button class="filter-btn" onclick="setFilter('inprogress',this)">In Progress</button>
    <button class="filter-btn" onclick="setFilter('blocked',this)">Blocked</button>
    <button class="filter-btn" onclick="setFilter('high',this)">High Priority</button>

  <div id="active-list"></div>

  <div id="done-list"></div>
</div>

<!-- ════════════════════════════════════════════════════ ESTM TAB -->
<div id="tab-estm" class="tab-panel">

  <div class="card">
    <div class="section-title">Staging Environment</div>
    <div class="env-group">
      <button class="env-preset active" onclick="setEstmEnv('eauto',this)">eauto</button>
      <button class="env-preset" onclick="setEstmEnv('sit2',this)">sit2</button>
      <button class="env-preset" onclick="setEstmEnv('sit3',this)">sit3</button>
      <button class="env-preset" onclick="setEstmEnv('preprod1',this)">preprod1</button>
      <button class="env-preset" onclick="setEstmEnv('preprod2',this)">preprod2</button>
      <button class="env-preset" onclick="setEstmEnv('uat2',this)">uat2</button>
      <button class="env-preset" onclick="setEstmEnv('uat3',this)">uat3</button>

      <div>
        <label>Password</label>

      </div>
      <input type="hidden" id="estm-idtype" value="1">

    <div class="form-row" style="margin-bottom:14px;">
      <div>
        <label>Vehicle Registration Number <span style="color:var(--red)">*</span></label>

    <div class="btn-actions">
      <button class="btn btn-run" id="btn-estm-run" onclick="runEstm()">&#9654; Run eSTM</button>
      <button class="btn btn-stop" id="btn-estm-stop" disabled onclick="stopRun()">&#9632; Stop</button>

  <div class="card">
    <div class="section-title">Step Progress</div>
    <div class="step-grid" id="estm-steps"></div>

  <div class="card">
    <div class="section-title">Live Log</div>
    <div class="log-panel" id="estm-log"></div>
  </div>

  <!-- Result -->
  <div class="result-card" id="estm-result">
    <div class="section-title" style="color:var(--accent);">Result</div>
    <div class="result-grid" id="estm-result-grid"></div>
  </div>

<!-- ════════════════════════════════════════════════════ INSURANCE TAB -->
<div id="tab-insurance" class="tab-panel">

  <!-- Vehicle Input -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div class="section-title" style="margin:0;">Vehicles</div>
      <span id="ins-vehicle-count" style="font-size:12px;color:var(--text3);font-family:var(--mono);">0 vehicles</span>
    </div>
    <textarea id="ins-paste"
      placeholder="Paste vehicle numbers here — one per line.&#10;&#10;Formats supported:&#10;  JKC9998&#10;  JKC9998, 020406081081&#10;  JKC9998, 020406081081, 31150&#10;  JKC9998, 020406081081, 31150, Individual"
      style="width:100%;height:160px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:12px;color:var(--text);font-family:var(--mono);font-size:13px;resize:vertical;outline:none;line-height:1.7;"

// ════════════════════════════════════════ UTILITY
function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}

function now() {
  const d = new Date();
  return d.toTimeString().slice(0,8);
}

function randomEmail() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < 10; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s + '@test.com';
}

function randomMobile() {
  const second = ['1','2','3','4','6','7','8','9'][Math.floor(Math.random() * 8)];
  let rest = '';
  const len = Math.floor(Math.random() * 4) + 7; // 7-10 digits after "01x"
  for (let i = 0; i < len; i++) rest += Math.floor(Math.random() * 10);
  return '01' + second + rest;
}

// Always talk to the server at localhost:3000 regardless of how the page was opened
const SERVER = 'http://localhost:3000';

// ════════════════════════════════════════ SSE STREAM
async function streamRun(url, body, onEvent) {
  const resp = await fetch(SERVER + url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) { onEvent('error', { text: `HTTP ${resp.status}` }); return; }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const chunks = buf.split('\n\n');
    buf = chunks.pop() || '';
    for (const chunk of chunks) {
      if (!chunk.trim()) continue;
      let eventName = 'message', dataStr = '';
      for (const line of chunk.split('\n')) {
        if (line.startsWith('event: ')) eventName = line.slice(7).trim();
        else if (line.startsWith('data: ')) dataStr = line.slice(6);
      }
      if (dataStr) {
        try { onEvent(eventName, JSON.parse(dataStr)); } catch { onEvent(eventName, { text: dataStr }); }
      }
    }
  }
}

// ════════════════════════════════════════ LOG PANEL
function appendLog(panelId, text, level = 'info') {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  const line = document.createElement('div');
  line.className = 'log-line ' + level;
  line.innerHTML = `<span class="log-ts">${now()}</span>${escHtml(text)}`;
  panel.appendChild(line);
  panel.scrollTop = panel.scrollHeight;
}

function clearLog(panelId) {
  const panel = document.getElementById(panelId);
  if (panel) panel.innerHTML = '';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function stopRun() {
  await fetch(SERVER + '/api/stop', { method: 'POST' });
}

const ESTM_STEPS = [
  { step:'login',           label:'Login' },
  { step:'popup',           label:'Close Popup' },
  { step:'eserahan',        label:'Click eSERAHAN' },
  { step:'create_btn',      label:'Create Transaction' },
  { step:'id_type',         label:'Select ID Type' },
  { step:'vehicle_no',      label:'Fill Vehicle No.' },
  { step:'buyer_consent',   label:'Buyer Consent' },
  { step:'bypass1',         label:'Apply Bypass' },
  { step:'reconfirm_email', label:'Reconfirm Email' },
  { step:'contact_details', label:'Contact Details' },
  { step:'engine_chassis',  label:'Engine & Chassis' },
  { step:'submit_step3',    label:'Submit Step 3' },
  { step:'ucd_consent',     label:'UCD Consent' },
  { step:'bypass2',         label:'2nd Bypass' },
  { step:'payment_done',    label:'Payment & Done' },
];

function initEstmSteps() {
  const grid = document.getElementById('estm-steps');
  grid.innerHTML = '';
  ESTM_STEPS.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'step-card';
    card.id = 'step-' + s.step;
    card.innerHTML = `<span class="step-num">${String(i+1).padStart(2,'0')}</span><span class="step-label">${escHtml(s.label)}</span><span class="step-icon">⏳</span>`;
    grid.appendChild(card);
  });
}

function updateEstmStep(step, status) {
  const card = document.getElementById('step-' + step);
  if (!card) return;
  card.className = 'step-card ' + status;
  const icon = card.querySelector('.step-icon');
  if (status === 'pending') icon.textContent = '⏳';
  else if (status === 'running') icon.textContent = '▶';
  else if (status === 'done') icon.textContent = '✅';
  else if (status === 'error') icon.textContent = '❌';
}

function resetEstmSteps() {
  ESTM_STEPS.forEach(s => updateEstmStep(s.step, 'pending'));
}

function setEstmEnv(env, btn) {
  document.getElementById('estm-env').value = env;
  document.getElementById('estm-env-actual').value = env;
  document.querySelectorAll('#tab-estm .env-preset').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

  document.getElementById('estm-idtype').value = val;
  document.querySelectorAll('.tog[onclick^="setIdType"]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

let emailRandOn = false, mobileRandOn = false;

function toggleRand(field) {
  if (field === 'email') {
    emailRandOn = !emailRandOn;
    const btn = document.getElementById('estm-rand-email');
    const inp = document.getElementById('estm-email');
    if (emailRandOn) { btn.classList.add('active'); inp.value = randomEmail(); inp.disabled = true; }
    else { btn.classList.remove('active'); inp.disabled = false; inp.value = ''; }
  } else {
    mobileRandOn = !mobileRandOn;
    const btn = document.getElementById('estm-rand-mobile');
    const inp = document.getElementById('estm-mobile');
    if (mobileRandOn) { btn.classList.add('active'); inp.value = randomMobile(); inp.disabled = true; }
    else { btn.classList.remove('active'); inp.disabled = false; inp.value = ''; }
  }
}

async function runEstm() {
  const env = document.getElementById('estm-env').value.trim();
  const vrn = document.getElementById('estm-vrn').value.trim();
  const email = document.getElementById('estm-email').value.trim();
  const mobile = document.getElementById('estm-mobile').value.trim();

  if (!env) { alert('Enter a staging environment.'); return; }
  if (!vrn) { alert('Enter a vehicle registration number.'); return; }
  if (!email) { alert('Enter an email address.'); return; }
  if (!mobile) { alert('Enter a mobile number.'); return; }

  clearLog('estm-log');
  resetEstmSteps();
  document.getElementById('estm-result').classList.remove('visible');
  document.getElementById('btn-estm-run').disabled = true;
  document.getElementById('btn-estm-stop').disabled = false;

  const config = {
    env,
    username: document.getElementById('estm-username').value.trim(),
    password: document.getElementById('estm-password').value,
    idType:   document.getElementById('estm-idtype').value,
    vehicleRegNo: vrn,
    email,
    mobile,
  };

  try {
    await streamRun('/api/estm/run', { config }, (evt, data) => {
      if (evt === 'log')      { appendLog('estm-log', data.text, data.level); }
      if (evt === 'error')    { appendLog('estm-log', data.text, 'error'); }
      if (evt === 'progress') { updateEstmStep(data.step, data.status); }
      if (evt === 'result')   { showEstmResult(data); }
      if (evt === 'status') {
        if (data.status !== 'running') {
          document.getElementById('btn-estm-run').disabled = false;
          document.getElementById('btn-estm-stop').disabled = true;
        }
      }
    });
  } catch(e) {
    appendLog('estm-log', 'Connection error: ' + e.message, 'error');
    document.getElementById('btn-estm-run').disabled = false;
    document.getElementById('btn-estm-stop').disabled = true;
  }
}

function showEstmResult(data) {
  const card = document.getElementById('estm-result');
  const grid = document.getElementById('estm-result-grid');
  card.classList.add('visible');
  const kv = (k, v) => `<div class="result-kv"><div class="result-key">${escHtml(k)}</div><div class="result-val">${v}</div></div>`;
  grid.innerHTML = kv('Vehicle Reg No', escHtml(data.vehicleRegNo || '-'))
    + kv('Environment', escHtml(data.envSegment || '-'))
    + kv('ID Type', escHtml(data.idType || '-'))
    + kv('Email', escHtml(data.emailAddress || '-'))
    + kv('Mobile', escHtml(data.mobileNo || '-'))
    + `<div class="result-kv"><div class="result-key">Final URL</div><div class="result-url"><a href="${escHtml(data.finalUrl||'#')}" target="_blank">${escHtml(data.finalUrl||'-')}</a></div></div>`;
}

// ════════════════════════════════════════ INSURANCE TAB
function parseVehiclePaste() {
  const raw  = document.getElementById('ins-paste').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const vehicles = lines.map(line => {
    // Support comma, tab, or semicolon separation
    const parts = line.split(/[,;\t]+/).map(p => p.trim());
    return {
      vehicleNumber:   parts[0] || '',
      icNumber:        parts[1] || '',
      postcode:        parts[2] || '',
      vehicleCategory: (parts[3] || '').toLowerCase() || 'individual',
    };
  }).filter(v => v.vehicleNumber);

  const preview = document.getElementById('ins-parse-preview');
  const count   = document.getElementById('ins-vehicle-count');
  if (vehicles.length === 0) {
    preview.textContent = '';
    count.textContent = '0 vehicles';
  } else {
    const sample = vehicles.slice(0, 3).map(v => v.vehicleNumber).join(', ');
    const more   = vehicles.length > 3 ? ` +${vehicles.length - 3} more` : '';
    preview.innerHTML = `<span style="color:var(--accent)">✓ ${vehicles.length} vehicle(s) detected</span> — ${sample}${more}`;
    count.textContent = `${vehicles.length} vehicles`;
  }
  return vehicles;
}

function getVehicles() {
  return parseVehiclePaste();
}

async function runInsurance() {
  const vehicles = getVehicles();
  if (!vehicles.length) { alert('Add at least one vehicle with a registration number.'); return; }

  clearLog('ins-log');
  document.getElementById('ins-results').classList.remove('visible');
  document.getElementById('btn-ins-run').disabled = true;
  document.getElementById('btn-ins-stop').disabled = false;

  const config = {
    env:             document.getElementById('ins-env').value.trim() || 'sit2',
    username:        document.getElementById('ins-username').value.trim(),
    password:        document.getElementById('ins-password').value,
    icNumber:        document.getElementById('ins-ic').value.trim(),
    postcode:        document.getElementById('ins-postcode').value.trim(),
    vehicleCategory: document.getElementById('ins-category').value,
    mode:            document.getElementById('ins-mode').value,
    workers:         parseInt(document.getElementById('ins-workers').value) || 1,
  };

  try {
    await streamRun('/api/insurance/run', { vehicles, config }, (evt, data) => {
      if (evt === 'log')     { appendLog('ins-log', data.text, data.level); }
      if (evt === 'error')   { appendLog('ins-log', data.text, 'error'); }
      if (evt === 'results') { renderInsuranceResults(data); }
      if (evt === 'download') {
        const notice = document.getElementById('ins-download-notice');
        document.getElementById('ins-download-text').textContent = `Excel saved to Downloads: ${data.filename}`;
        notice.style.display = 'flex';
      }
      if (evt === 'status') {
        if (data.status !== 'running') {
          document.getElementById('btn-ins-run').disabled = false;
          document.getElementById('btn-ins-stop').disabled = true;
        }
      }
    });
  } catch(e) {
    appendLog('ins-log', 'Connection error: ' + e.message, 'error');
    document.getElementById('btn-ins-run').disabled = false;
    document.getElementById('btn-ins-stop').disabled = true;
  }
}

function renderInsuranceResults(data) {
  const { summary = [], skipped = [] } = data;
  const section = document.getElementById('ins-results');
  section.classList.add('visible');

  // Stats
  const vehicles = [...new Set(summary.map(r => r.vehicleNumber))];
  const allowCount = summary.filter(r => r.allowPurchase && r.allowPurchase.toLowerCase().includes('yes')).length;
  const blockedCount = summary.filter(r => r.allowPurchase && r.allowPurchase.toLowerCase().includes('no')).length;
  document.getElementById('ins-stats-bar').innerHTML = `
    <div class="stat-chip blue"><div class="stat-n">${vehicles.length}</div><div class="stat-lbl">Vehicles</div></div>
    <div class="stat-chip"><div class="stat-n" style="color:var(--text)">${summary.length}</div><div class="stat-lbl">Total Quotes</div></div>
    <div class="stat-chip green"><div class="stat-n">${allowCount}</div><div class="stat-lbl">Allow Purchase</div></div>
    <div class="stat-chip red"><div class="stat-n">${blockedCount}</div><div class="stat-lbl">Blocked</div></div>
    <div class="stat-chip amber"><div class="stat-n">${skipped.length}</div><div class="stat-lbl">Skipped</div></div>
  `;

  // Grouped results
  const body = document.getElementById('ins-results-body');
  body.innerHTML = '';

  vehicles.forEach(vn => {
    const rows = summary.filter(r => r.vehicleNumber === vn);
    const first = rows[0] || {};
    const group = document.createElement('div');
    group.className = 'vehicle-group';
    group.innerHTML = `
      <div class="vehicle-header">
        <span class="vehicle-reg">${escHtml(vn)}</span>
        <span class="vehicle-meta">
          <span>${escHtml(first.make || '')} ${escHtml(first.model || '')}</span>
          <span>${escHtml(first.mfgYear || '')}</span>
          <span>${escHtml(first.engineCC || '')} cc</span>
          <span>${escHtml(first.transmission || '')}</span>
        </span>
      </div>
      <div class="ins-table-wrap">
        <table class="ins-table">
          <thead><tr><th>Insurer</th><th>Cover Type</th><th>Allow Purchase</th><th>Refer Risk Code</th><th>Price</th></tr></thead>
          <tbody>${rows.map(r => {
            const ap = r.allowPurchase;
            const apYes = ap && (ap.toLowerCase().includes('yes') || ap === '1' || ap.toLowerCase() === 'true');
            return `<tr>
              <td>${escHtml(r.insurer)}</td>
              <td>${escHtml(r.coverType)}</td>
              <td class="${apYes ? 'allow-yes' : 'allow-no'}">${apYes ? '✅ Yes' : '❌ No'}</td>
              <td>${escHtml(r.referRiskCode)}</td>
              <td class="price">${escHtml(r.totalPrice)}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    `;
    body.appendChild(group);
  });

  // Skipped
  if (skipped.length) {
    const skipDiv = document.createElement('div');
    skipDiv.innerHTML = `
      <div class="section-title" style="margin-top:20px;">Skipped Vehicles</div>
      <div class="card" style="padding:0;overflow:hidden;">
        <table class="skipped-table">
          <thead><tr><th>Vehicle Number</th><th>Status</th><th>Reason</th></tr></thead>
          <tbody>${skipped.map(s => `<tr><td style="font-family:var(--mono);font-weight:600;">${escHtml(s.vehicleNumber)}</td><td>${escHtml(s.status)}</td><td>${escHtml(s.reason)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    `;
    body.appendChild(skipDiv);
  }
}

// ════════════════════════════════════════ QA TRACKER (ported from qa-tracker_1.html)
const STORE_KEY = 'qa_tracker_v2';
let tickets = [];
let filter = 'all';

// ── Persistence ──
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(tickets)); }
function load() {
  try { tickets = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { tickets = []; }
  if (!tickets.length) tickets = sampleData();
  render();
}

function sampleData() {
  return [
    {
      id: 'ZURICH-101', title: 'Insurance quote enquiry — EV & Petrol flow',
      type: 'story', priority: 'high', status: 'inprogress',
      env: 'SIT3', module: 'Zurich Insurance', target: '2026-05-30',
      blockedReason: '',
      modules: [
        { name: 'eAuto', done: 68, total: 133 },
        { name: 'Secarang', done: 23, total: 75 },
        { name: 'CIBO', done: 4, total: 7 }
      ],
      logs: [{ date: '19 May', text: 'Completed EV vehicle type detection test cases' }],
      done: false, createdDate: '2026-05-15'
    },
    {
      id: 'STMS-055', title: 'Long email address UI layout bug',
      type: 'bug', priority: 'medium', status: 'inprogress',
      env: 'UAT', module: 'STMS', target: '2026-05-22',
      blockedReason: '',
      modules: [{ name: 'Overall', done: 3, total: 5 }],
      logs: [],
      done: false, createdDate: '2026-05-18'
    }
  ];
}

// ── Modal ──
let editMode = false;
function openModal(ticketId) {
  editMode = !!ticketId;
  document.getElementById('modalTitle').textContent = editMode ? 'Edit Ticket' : 'New Ticket';
  document.getElementById('editId').value = ticketId || '';
  clearForm();
  if (editMode) {
    const t = tickets.find(x => x.id === ticketId);
    if (t) populateForm(t);
  } else {
    addModRow();
  }
  document.getElementById('f-status').dispatchEvent(new Event('change'));
  document.getElementById('qt-modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('qt-modal-overlay').classList.remove('open'); }
function closeOnBg(e) { if (e.target === document.getElementById('qt-modal-overlay')) closeModal(); }

function clearForm() {
  ['f-id','f-title','f-env','f-module','f-target','f-blocked'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-type').value = 'task';
  document.getElementById('f-priority').value = 'medium';
  document.getElementById('f-status').value = 'todo';
  document.getElementById('mod-rows').innerHTML = '';
}
function populateForm(t) {
  document.getElementById('f-id').value = t.id;
  document.getElementById('f-title').value = t.title;
  document.getElementById('f-type').value = t.type;
  document.getElementById('f-priority').value = t.priority;
  document.getElementById('f-status').value = t.status;
  document.getElementById('f-env').value = t.env || '';
  document.getElementById('f-module').value = t.module || '';
  document.getElementById('f-target').value = t.target || '';
  document.getElementById('f-blocked').value = t.blockedReason || '';
  document.getElementById('mod-rows').innerHTML = '';
  (t.modules || []).forEach(m => addModRow(m.name, m.done, m.total));
}

document.getElementById('f-status').addEventListener('change', function() {
  document.getElementById('blocked-reason-row').style.display = this.value === 'blocked' ? '' : 'none';
});

function addModRow(name='', done='', total='') {
  const row = document.createElement('div');
  row.className = 'mod-row';
  row.style.display = 'grid';
  row.style.gridTemplateColumns = '1fr 70px 70px 24px';
  row.style.gap = '8px';
  row.style.marginBottom = '6px';
  row.innerHTML = `
    <input class="form-input mod-name" placeholder="Module name" value="${name}" style="padding:5px 8px;font-size:12px;" />
    <input class="form-input mod-done" type="number" placeholder="0" value="${done}" min="0" style="padding:5px 8px;font-size:12px;" />
    <input class="form-input mod-total" type="number" placeholder="0" value="${total}" min="0" style="padding:5px 8px;font-size:12px;" />
    <button class="btn-remove-mod" onclick="this.parentElement.remove()">×</button>`;
  document.getElementById('mod-rows').appendChild(row);
}

function saveTicket() {
  const id = document.getElementById('f-id').value.trim();
  const title = document.getElementById('f-title').value.trim();
  if (!id || !title) { alert('Ticket ID and Title are required.'); return; }

  const modRows = document.querySelectorAll('#mod-rows .mod-row');
  const modules = [];
  modRows.forEach(r => {
    const name = r.querySelector('.mod-name').value.trim();
    const done = parseInt(r.querySelector('.mod-done').value) || 0;
    const total = parseInt(r.querySelector('.mod-total').value) || 0;
    if (name) modules.push({ name, done, total });
  });

  const status = document.getElementById('f-status').value;
  const ticketData = {
    id, title,
    type: document.getElementById('f-type').value,
    priority: document.getElementById('f-priority').value,
    status,
    env: document.getElementById('f-env').value.trim(),
    module: document.getElementById('f-module').value.trim(),
    target: document.getElementById('f-target').value,
    blockedReason: status === 'blocked' ? document.getElementById('f-blocked').value.trim() : '',
    modules,
    logs: [],
    done: false,
    createdDate: new Date().toISOString().slice(0,10)
  };

  if (editMode) {
    const idx = tickets.findIndex(x => x.id === document.getElementById('editId').value);
    if (idx > -1) {
      ticketData.logs = tickets[idx].logs;
      ticketData.done = tickets[idx].done;
      ticketData.createdDate = tickets[idx].createdDate || ticketData.createdDate;
      tickets[idx] = ticketData;
    }
  } else {
    if (tickets.find(x => x.id === id)) { alert('Ticket ID already exists.'); return; }
    tickets.unshift(ticketData);
  }
  save(); render(); closeModal();
}

// ── Mark done / undone ──
function markDone(id) {
  const t = tickets.find(x => x.id === id);
  if (t) { t.done = true; t.status = 'done'; t.completedDate = new Date().toISOString().slice(0,10); save(); render(); }
}
function markUndone(id) {
  const t = tickets.find(x => x.id === id);
  if (t) { t.done = false; t.status = 'inprogress'; t.completedDate = null; save(); render(); }
}
function deleteTicket(id) {
  if (!confirm('Delete this ticket?')) return;
  tickets = tickets.filter(x => x.id !== id);
  save(); render();
}

// ── Log ──
function addLog(id) {
  const input = document.getElementById('log-input-' + id);
  const text = input.value.trim();
  if (!text) return;
  const t = tickets.find(x => x.id === id);
  if (!t) return;
  const d = new Date();
  const date = d.getDate() + ' ' + d.toLocaleString('default',{month:'short'});
  t.logs.unshift({ date, text });
  input.value = '';
  save(); render();
}

function deleteLog(id, index) {
  const t = tickets.find(x => x.id === id);
  if (!t || !t.logs) return;
  t.logs.splice(index, 1);
  save(); render();
}

// ── Notes (per ticket: add / edit / delete) ──
let noteEdit = { ticketId: null, noteId: null };

function openNoteEditor(id) {
  noteEdit = { ticketId: id, noteId: null };
  const ed = document.getElementById('note-editor-' + id);
  document.getElementById('note-title-' + id).value = '';
  document.getElementById('note-body-' + id).value = '';
  ed.classList.add('open');
  document.getElementById('note-body-' + id).focus();
}

function cancelNote(id) {
  noteEdit = { ticketId: null, noteId: null };
  document.getElementById('note-editor-' + id).classList.remove('open');
}

function editNote(ticketId, noteId) {
  const t = tickets.find(x => x.id === ticketId);
  if (!t) return;
  const n = (t.notes || []).find(x => x.id === noteId);
  if (!n) return;
  noteEdit = { ticketId, noteId };
  const ed = document.getElementById('note-editor-' + ticketId);
  document.getElementById('note-title-' + ticketId).value = n.title || '';
  document.getElementById('note-body-' + ticketId).value = n.body || '';
  ed.classList.add('open');
  ed.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function saveNote(id) {
  const t = tickets.find(x => x.id === id);
  if (!t) return;
  if (!t.notes) t.notes = [];
  const title = document.getElementById('note-title-' + id).value.trim();
  const body  = document.getElementById('note-body-' + id).value.trim();
  if (!title && !body) { alert('Write a title or note body first.'); return; }
  const d = new Date();
  const stamp = d.getDate() + ' ' + d.toLocaleString('default',{month:'short'}) + ' ' + d.getFullYear();

  if (noteEdit.ticketId === id && noteEdit.noteId) {
    const n = t.notes.find(x => x.id === noteEdit.noteId);
    if (n) { n.title = title; n.body = body; n.date = stamp + ' (edited)'; }
  } else {
    t.notes.unshift({ id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), title, body, date: stamp });
  }
  noteEdit = { ticketId: null, noteId: null };
  save(); render();
}

function deleteNote(ticketId, noteId) {
  if (!confirm('Delete this note?')) return;
  const t = tickets.find(x => x.id === ticketId);
  if (!t || !t.notes) return;
  t.notes = t.notes.filter(n => n.id !== noteId);
  save(); render();
}

// ── Filter ──
function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('#tab-tracker .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── Progress calc ──
function calcProgress(modules) {
  if (!modules || !modules.length) return { pct: 0, totalDone: 0, totalAll: 0 };
  const totalDone = modules.reduce((a,m) => a + (m.done||0), 0);
  const totalAll  = modules.reduce((a,m) => a + (m.total||0), 0);
  const pct = totalAll > 0 ? Math.round((totalDone / totalAll) * 100) : 0;
  return { pct, totalDone, totalAll };
}

function barClass(pct) {
  if (pct < 30) return 'low';
  if (pct < 70) return 'medium';
  return '';
}

// ── Render progress ──
function renderProgress(t) {
  const mods = t.modules || [];
  if (!mods.length) return '';

  const single = mods.length === 1;
  if (single) {
    const m = mods[0];
    const total = m.total || 0;
    const done  = m.done || 0;
    const pct   = total > 0 ? Math.round((done/total)*100) : 0;
    const bc    = barClass(pct);
    return `
      <div class="progress-section">
        <div class="progress-label">
          <span class="progress-name">Overall CR Testing Progress</span>
          <span class="progress-pct">${done}/${total} (${pct}%)</span>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill ${bc}" style="width:${pct}%"></div></div>
      </div>`;
  }

  const { pct: ovPct, totalDone, totalAll } = calcProgress(mods);
  const bc = barClass(ovPct);
  let modLines = mods.map(m => {
    const total = m.total || 0;
    const done  = m.done || 0;
    const pct   = total > 0 ? Math.round((done/total)*100) : 0;
    const mbc   = barClass(pct);
    return `
      <div>
        <div class="progress-label" style="margin-bottom:3px;">
          <span class="progress-sub">▸ ${m.name} — ${done}/${total} (${pct}%) <span style="color:var(--accent);font-size:10px;">PASS Only</span></span>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill ${mbc}" style="width:${pct}%"></div></div>
      </div>`;
  }).join('');

  return `
    <div class="progress-section">
      <div class="progress-label" style="margin-bottom:6px;">
        <span class="progress-name">Overall CR Testing Progress</span>
        <span class="progress-pct">${totalDone}/${totalAll} (${ovPct}%)</span>
      </div>
      <div class="progress-bar-wrap" style="margin-bottom:10px;"><div class="progress-bar-fill ${bc}" style="width:${ovPct}%"></div></div>
      <div class="progress-modules">${modLines}</div>
    </div>`;
}

// ── Render ticket ──
function renderTicket(t) {
  const today = new Date(); today.setHours(0,0,0,0);
  let targetHtml = '';
  if (t.target) {
    const td = new Date(t.target);
    const overdue = !t.done && td < today;
    const diff = Math.round((td - today) / 86400000);
    const label = overdue ? 'overdue by ' + Math.abs(diff) + 'd' : (diff === 0 ? 'due today' : 'due in ' + diff + 'd');
    targetHtml = `<span class="meta-item ${overdue ? 'overdue' : ''}">Target: <span>${t.target} · ${label}</span></span>`;
  }
  const envHtml    = t.env    ? `<span class="tag tag-env">${t.env}</span>` : '';
  const moduleHtml = t.module ? `<span class="tag tag-env">${t.module}</span>` : '';
  const blockedHtml = (t.status === 'blocked' && t.blockedReason)
    ? `<div class="blocked-note">⊘ Blocked: ${t.blockedReason}</div>` : '';

  const logs = (t.logs||[]).slice(0,6).map((l, i) =>
    `<div class="log-entry"><span class="log-date">${escHtml(l.date)}</span><span class="log-text">${escHtml(l.text)}</span><button class="log-del" title="Delete log" onclick="deleteLog('${t.id}',${i})">✕</button></div>`).join('');

  const notes = (t.notes||[]).map(n =>
    `<div class="note">
       ${n.title ? `<div class="note-title">${escHtml(n.title)}</div>` : ''}
       ${n.body ? `<div class="note-body">${escHtml(n.body)}</div>` : ''}
       <div class="note-meta">${escHtml(n.date || '')}</div>
       <div class="note-actions">
         <button class="note-edit" onclick="editNote('${t.id}','${n.id}')">edit</button>
         <button class="note-del" onclick="deleteNote('${t.id}','${n.id}')">delete</button>
       </div>
     </div>`).join('');

  const actionBtns = t.done
    ? `<button class="icon-btn undone-btn" onclick="markUndone('${t.id}')">↩ reopen</button>`
    : `<button class="icon-btn done-btn" onclick="markDone('${t.id}')">✓ done</button>`;

  return `
    <div class="ticket ${t.done ? 'done' : ''} ${t.status === 'blocked' ? 'blocked' : ''}" id="ticket-${t.id}">
      <div class="ticket-top">
        <span class="ticket-id">${t.id}</span>
        <span class="ticket-title">${t.title}</span>
        <div class="ticket-actions">
          ${actionBtns}
          <button class="icon-btn edit-btn" onclick="openModal('${t.id}')">edit</button>
          <button class="icon-btn del-btn" onclick="deleteTicket('${t.id}')">del</button>
        </div>
      </div>
      <div class="ticket-tags">
        <span class="tag tag-type-${t.type}">${t.type}</span>
        <span class="tag tag-pri-${t.priority}">${t.priority}</span>
        <span class="tag tag-status-${t.done ? 'done' : t.status}">${t.done ? 'done' : t.status.replace('inprogress','in progress')}</span>
        ${envHtml}${moduleHtml}
      </div>
      <div class="ticket-meta">
        ${t.createdDate ? `<span class="meta-item">Created: <span>${t.createdDate}</span></span>` : ''}
        ${t.completedDate ? `<span class="meta-item">Completed: <span style="color:var(--accent)">${t.completedDate}</span></span>` : ''}
        ${targetHtml}
      </div>
      ${blockedHtml}
      ${renderProgress(t)}
      <div class="log-section">
        <div class="log-head">Daily Log</div>
        <div id="logs-${t.id}">${logs || '<span style="font-size:11px;color:var(--text3);">No entries yet.</span>'}</div>
        <div class="log-input-row">
          <input class="log-input" id="log-input-${t.id}" placeholder="Add a progress note for today…" onkeydown="if(event.key==='Enter')addLog('${t.id}')" />
          <button class="btn-log" onclick="addLog('${t.id}')">+ log</button>
        </div>
      </div>

      <div class="notes-section">
        <div class="notes-head">
          <span class="lbl">Notes</span>
          <button class="note-add-btn" onclick="openNoteEditor('${t.id}')">+ Add Note</button>
        </div>
        <div>${notes}</div>
        <div class="note-editor" id="note-editor-${t.id}">
          <input id="note-title-${t.id}" placeholder="Short title (optional)" />
          <textarea id="note-body-${t.id}" placeholder="Write a note — short or long…"></textarea>
          <div style="display:flex;gap:6px;">
            <button class="note-save" onclick="saveNote('${t.id}')">Save Note</button>
            <button class="note-cancel" onclick="cancelNote('${t.id}')">Cancel</button>
          </div>
        </div>
      </div>
    </div>`;
}

// ── Main render ──
function render() {
  let active = tickets.filter(t => !t.done);
  if (filter === 'todo') active = active.filter(t => t.status === 'todo');
  else if (filter === 'inprogress') active = active.filter(t => t.status === 'inprogress');
  else if (filter === 'blocked') active = active.filter(t => t.status === 'blocked');
  else if (filter === 'high') active = active.filter(t => t.priority === 'high');

  const done = tickets.filter(t => t.done);
  const allActive = tickets.filter(t => !t.done);

  document.getElementById('active-list').innerHTML = active.length
    ? active.map(renderTicket).join('') : '<div class="empty">no tickets here</div>';
  document.getElementById('done-list').innerHTML = done.length
    ? done.map(renderTicket).join('') : '<div class="empty">no completed tickets yet</div>';

  document.getElementById('active-count').textContent = allActive.length;
  document.getElementById('done-count').textContent = done.length;

  const blocked = allActive.filter(t => t.status === 'blocked').length;
  document.getElementById('stat-active').textContent = allActive.length;
  document.getElementById('stat-blocked').textContent = blocked;
  document.getElementById('stat-done').textContent = done.length;
}
